<div class="timer-container">
  <div class="progress-container">
    <svg viewBox="0 0 100 100">
      <circle class="bg" cx="50" cy="50" r="45"></circle>
      <circle class="progress" cx="50" cy="50" r="45"
              [style.stroke-dashoffset]="calculateOffset()"></circle>
    </svg>
    
    <div class="time-display">
      <span class="minutes">{{ formatTime() }}</span>
      <span class="label">FOCUS</span>
    </div>
  </div>

  <div class="controls">
    <button (click)="toggleTimer()" class="btn-play">
      {{ isActive ? '⏸' : '▶' }}
    </button>
    <button (click)="resetTimer()" class="btn-reset">↺</button>
  </div>

  <div class="timer-config">
  <label>Durée (minutes)</label>

  <input
    type="number"
    min="1"
    max="180"
    [value]="getDurationMinutes()"
    (change)="changeDuration($event)"
  />
</div>

<div class="presets">
  <button (click)="setDuration(15)">15 min</button>
  <button (click)="setDuration(25)">25 min</button>
  <button (click)="setDuration(50)">50 min</button>
  <button (click)="setDuration(90)">90 min</button>
</div>

</div>
