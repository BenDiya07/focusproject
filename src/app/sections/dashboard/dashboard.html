<section class="dashboard">

  <div class="stats-grid">

    <div class="stat-card">
      <span class="stat-label">Temps total</span>
      <span class="stat-value">
        {{ dashboardService.totalStudyTime() }} min
      </span>
    </div>

    <div class="stat-card">
      <span class="stat-label">Sessions</span>
      <span class="stat-value">
        {{ dashboardService.totalSessions() }}
      </span>
    </div>

    <div class="stat-card">
      <span class="stat-label">Moyenne</span>
      <span class="stat-value">
        {{ dashboardService.averageSession() }} min
      </span>
    </div>

    <div class="stat-card">
      <span class="stat-label">Streak</span>
      <span class="stat-value">
        {{ dashboardService.streak() }}
      </span>
    </div>

  </div>

</section>
