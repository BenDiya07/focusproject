<section class="studio-container">
  <h2>Le Studio</h2>
  <div class="timer-wrapper">
    <app-timer></app-timer>
  </div>

  <div class="section-divider"></div>

  <div class="sound-grid">
    @for (s of sounds; track s) {
      <div class="sound-card" #card [class.active]="audioService.activeSound() === s" (click)="play(s, card)">
        <span class="emoji">{{ getEmoji(s) }}</span>
        <span>{{ getName(s) }}</span>

        @if (audioService.activeSound() === s) {
          <div class="equalizer">
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
            <div class="bar"></div>
          </div>
        }
      </div>
    }
  </div>

  <div class="volume-control">
    <label>Volume</label>
    <input
      type="range"
      min="0"
      max="1"
      step="0.1"
      [value]="volume"
      (input)="updateVolume($event)"
    />
    <div class="play-button">
      <p-button 
        icon="pi pi-play" 
        label="Lecture"
        [disabled]="audioService.isPlaying()"
        (onClick)="audioService.activeSound() ? audioService.resume() : play('rain')"> 
      </p-button>
      <p-button
        icon="pi pi-pause"
        label="Pause"
        severity="contrast"
        (onClick)="audioService.pause()"
      >
      </p-button>
      
    </div>
  </div>
</section>
